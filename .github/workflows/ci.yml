name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Package unpacked desktop
        run: pnpm --filter @openmovie/desktop exec electron-builder --dir --publish never

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM from the locked dependency graph
        run: node scripts/generate-sbom.mjs artifacts/openmovie-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: openmovie-sbom
          path: artifacts/openmovie-sbom.cdx.json
          if-no-files-found: error
