name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 11.23.0
          runtime: node@22.22.3
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm perf:baseline -- --enforce
      - name: Package unpacked desktop
        run: pnpm --filter @openmovie/desktop exec electron-builder --dir --publish never

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate CycloneDX SBOM from the locked dependency graph
        run: node scripts/generate-sbom.mjs artifacts/openmovie-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: openmovie-sbom
          path: artifacts/openmovie-sbom.cdx.json
          if-no-files-found: error
