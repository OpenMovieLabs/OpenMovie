name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v prefix
        required: true

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
          - os: windows-2025
            target: win
    runs-on: ${{ matrix.os }}
    env:
      OPENMOVIE_REQUIRE_CODE_SIGNING: ${{ github.ref_type == 'tag' && '1' || '0' }}
      CSC_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.target == 'mac' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.target == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.target == 'mac' && secrets.APPLE_TEAM_ID || '' }}
      WIN_CSC_LINK: ${{ matrix.target == 'win' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "OPENMOVIE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "OPENMOVIE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi
      - run: node scripts/set-version.mjs "$OPENMOVIE_VERSION"
        shell: bash
      - name: Build pinned LGPL FFmpeg Sidecar (macOS)
        if: matrix.target == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz"
          source_root="$RUNNER_TEMP/ffmpeg-source"
          install_root="$RUNNER_TEMP/ffmpeg-install"
          destination="apps/desktop/resources/ffmpeg"
          curl --fail --location --retry 3 --output "$archive" https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz
          echo "cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635  $archive" | shasum -a 256 --check
          mkdir -p "$source_root" "$install_root" "$destination/bin"
          tar -xf "$archive" -C "$source_root" --strip-components=1
          pushd "$source_root"
          ./configure \
            --prefix="$install_root" \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --disable-network \
            --disable-autodetect \
            --enable-zlib \
            --enable-videotoolbox \
            --enable-audiotoolbox \
            --enable-static \
            --disable-shared
          make -j3
          make install
          popd
          cp "$install_root/bin/ffmpeg" "$install_root/bin/ffprobe" "$destination/bin/"
          cp "$source_root/LICENSE.md" "$source_root/COPYING.LGPLv2.1" "$source_root/COPYING.LGPLv3" "$destination/"
          "$destination/bin/ffmpeg" -hide_banner -version
          configuration=$("$destination/bin/ffmpeg" -hide_banner -version 2>&1)
          if grep -q -- '--enable-gpl' <<<"$configuration"; then
            echo "Refusing to package a GPL-enabled FFmpeg build" >&2
            exit 1
          fi
          encoders=$("$destination/bin/ffmpeg" -hide_banner -encoders 2>/dev/null)
          grep -q ' mpeg4 ' <<<"$encoders"
      - name: Download pinned LGPL FFmpeg Sidecar (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64-lgpl.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64-lgpl'
          $destination = 'apps/desktop/resources/ffmpeg'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-20-13-45/ffmpeg-n9.0.1-6-g9d4ca21220-win64-lgpl-9.0.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = 'ccaa910db95451121482a5ebcb8c682123cb4f8a5bd5170fde4a814d7b437772'
          if ($actual -ne $expected) { throw "FFmpeg archive checksum mismatch" }
          Expand-Archive -Path $archive -DestinationPath $expanded
          New-Item -ItemType Directory -Force -Path "$destination/bin" | Out-Null
          $ffmpeg = Get-ChildItem -Path $expanded -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $expanded -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg archive is missing executables' }
          Copy-Item $ffmpeg.FullName "$destination/bin/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "$destination/bin/ffprobe.exe"
          Get-ChildItem -Path $expanded -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING).*' } | Copy-Item -Destination $destination
          & "$destination/bin/ffmpeg.exe" -hide_banner -version
          $configuration = (& "$destination/bin/ffmpeg.exe" -hide_banner -version 2>&1) -join "`n"
          if ($configuration -match '--enable-gpl') { throw 'Refusing to package a GPL-enabled FFmpeg build' }
          $encoders = (& "$destination/bin/ffmpeg.exe" -hide_banner -encoders 2>&1) -join "`n"
          if ($encoders -notmatch '\smpeg4\s') { throw 'FFmpeg Sidecar lacks the MPEG-4 fallback encoder' }
      - run: pnpm check
      - run: pnpm build
      - name: Verify release signing configuration
        run: node scripts/verify-release-signing.mjs ${{ matrix.target }}
      - name: Package desktop
        run: pnpm --filter @openmovie/desktop exec electron-builder --${{ matrix.target }} --publish never
      - name: Smoke test packaged desktop and bundled media runtime
        run: node scripts/smoke-packaged.mjs release/${{ env.OPENMOVIE_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMovie-${{ matrix.target }}-${{ env.OPENMOVIE_VERSION }}
          path: |
            release/${{ env.OPENMOVIE_VERSION }}/*.dmg
            release/${{ env.OPENMOVIE_VERSION }}/*.zip
            release/${{ env.OPENMOVIE_VERSION }}/*.exe
            release/${{ env.OPENMOVIE_VERSION }}/*.yml
            release/${{ env.OPENMOVIE_VERSION }}/*.blockmap
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate release SBOM and checksums
        env:
          OPENMOVIE_VERSION: ${{ github.ref_name }}
        run: |
          node scripts/generate-sbom.mjs release-assets/openmovie-sbom.cdx.json
          node scripts/checksums.mjs release-assets release-assets/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
